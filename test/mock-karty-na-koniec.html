<!doctype html><meta charset="utf-8"><title>ATRAPA — karty z linków na końcu listy</title>
<!-- karty-na-koniec.js z atrapą API chrome: okno z kartami i grupami,
     które tabs.move/ungroup zmieniają jak Chrome. Link otwarty w nowej
     karcie to tabs.onCreated + webNavigation.onCreatedNavigationTarget;
     karty tworzone przez Chrome (nowa grupa, przywrócona sesja) dostają
     tylko onCreated. Skrót ⌘D to commands.onCommand + tabs.duplicate. -->
<style>
body { margin: 0; padding: 20px; font: 14px system-ui, sans-serif; background: #fff; color: #111; }
</style>

<body>
<h3>Atrapa — karty z linków na końcu listy</h3>
<button onclick="testuj()" style="cursor:pointer;padding:6px 12px;margin-bottom:10px">uruchom testy</button>
<pre id="log" style="white-space:pre-wrap;color:#0369a1"></pre>

<script>
// --- atrapa chrome -----------------------------------------------------------
// Okno to lista kart { id, groupId, windowId }; kolejność w tablicy = index.
const A = {
  ustawienia: {},
  karty: [],
  sluchacz: null,
  wolnyMove: false,           // move czeka chwilę, żeby było widać kolejność
  zamknietaPrzedMove: false,  // karta znika, zanim ją przeniesiemy
  grupaPrzyKoncu: false,      // Chrome dokłada kartę do grupy stojącej na końcu
  aktywna: null,
  komenda: null,
  duplikatDziala: true,
};
const znajdz = (id) => {
  const k = A.karty.find((k) => k.id === id);
  if (!k) throw new Error(`No tab with id: ${id}.`);
  return k;
};
window.chrome = {
  storage: { sync: { get: async () => ({ ustawienia: A.ustawienia }), set: async () => {} } },
  tabs: {
    get: async (id) => ({ windowId: 1, ...znajdz(id), index: A.karty.indexOf(znajdz(id)) }),
    move: async (id, { index }) => {
      if (A.wolnyMove) await new Promise((r) => setTimeout(r, 10 + Math.random() * 20));
      if (A.zamknietaPrzedMove) A.karty = A.karty.filter((k) => k.id !== id);
      const k = znajdz(id);
      A.karty.splice(A.karty.indexOf(k), 1);
      A.karty.splice(index === -1 ? A.karty.length : index, 0, k);
      const przed = A.karty[A.karty.indexOf(k) - 1];
      if (A.grupaPrzyKoncu && przed && przed.groupId !== -1) k.groupId = przed.groupId;
    },
    ungroup: async (id) => { znajdz(id).groupId = -1; },
    // Jak w Chrome: duplikat pod oryginałem, w jego grupie, od razu aktywny.
    duplicate: async (id) => {
      if (!A.duplikatDziala) throw new Error('Cannot duplicate');
      const o = znajdz(id);
      const kopia = { id: 100 + A.karty.length, groupId: o.groupId };
      A.karty.splice(A.karty.indexOf(o) + 1, 0, kopia);
      A.aktywna = kopia.id;
      return chrome.tabs.get(kopia.id);
    },
    update: async (id, { active }) => { znajdz(id); if (active) A.aktywna = id; },
    query: async () => [await chrome.tabs.get(A.aktywna)],
  },
  commands: { onCommand: { addListener: (f) => (A.komenda = f) } },
  webNavigation: { onCreatedNavigationTarget: { addListener: (f) => (A.sluchacz = f) } },
};
</script>
<script src="../wspolne/ustawienia.js"></script>
<script src="../karty-na-koniec/karty-na-koniec.js"></script>
<script>
const AUTO = location.search.includes('auto');
const log = document.getElementById('log');
window.addEventListener('error', (e) => { log.textContent += `\nBŁĄD TESTU: ${e.message} (${e.filename}:${e.lineno})\n`; });
let n = 0, ok = 0;
const sprawdz = (nazwa, warunek, szczegol = '') => {
  n++; if (warunek) ok++;
  log.textContent += `${warunek ? 'PASS' : 'FAIL'}  ${nazwa}${szczegol ? '  — ' + szczegol : ''}\n`;
};
const uklad = () => A.karty.map((k) => k.groupId === -1 ? k.id : `${k.id}g${k.groupId}`).join(' ');

// Okno: 1, grupa 5 (2, 3), 4. Chrome wstawia nową kartę pod rodzicem
// i dziedziczy jego grupę — tak jak przy ⌘-kliku.
function reset() {
  Object.assign(A, { ustawienia: {}, wolnyMove: false, zamknietaPrzedMove: false, grupaPrzyKoncu: false, aktywna: 2, duplikatDziala: true });
  A.karty = [{ id: 1, groupId: -1 }, { id: 2, groupId: 5 }, { id: 3, groupId: 5 }, { id: 4, groupId: -1 }];
}
function otworz(id, rodzic, opcje = {}) {
  const r = znajdz(rodzic);
  A.karty.splice(A.karty.indexOf(r) + 1, 0, { id, groupId: r.groupId, ...opcje });
  return A.sluchacz({ tabId: id, sourceTabId: rodzic, url: 'https://link.example/' });
}
// Karta, którą Chrome tworzy sam: tylko onCreated, którego nie słuchamy.
function utworzPrzezChrome(id, gdzie, groupId) {
  A.karty.splice(gdzie, 0, { id, groupId });
}

async function testuj() {
  log.textContent = '';
  n = 0; ok = 0;

  reset();
  await otworz(10, 1);
  sprawdz('link z karty bez grupy: na koniec', uklad() === '1 2g5 3g5 4 10', uklad());

  reset();
  await otworz(10, 2);
  sprawdz('link z karty w grupie: na koniec i poza grupą', uklad() === '1 2g5 3g5 4 10', uklad());

  reset();
  A.karty = [{ id: 1, groupId: -1 }, { id: 2, groupId: 5 }, { id: 3, groupId: 5 }];
  A.grupaPrzyKoncu = true;
  await otworz(10, 1);
  sprawdz('grupa na końcu okna: karta za nią, ale nie w niej', uklad() === '1 2g5 3g5 10', uklad());

  reset();
  utworzPrzezChrome(10, 3, 5);
  sprawdz('nowa grupa / karta dodana do grupy przez Chrome: nie ruszana', uklad() === '1 2g5 3g5 10g5 4', uklad());
  reset();
  utworzPrzezChrome(10, 1, 5); utworzPrzezChrome(11, 2, 5);
  sprawdz('przywrócona sesja z grupami: nie ruszana', uklad() === '1 10g5 11g5 2g5 3g5 4', uklad());

  reset();
  await otworz(10, 2, { groupId: 7 });
  sprawdz('link wstawiony do innej grupy niż rodzic: zostaje w niej', uklad() === '1 2g5 10g7 3g5 4', uklad());

  reset();
  await otworz(10, 2, { windowId: 2 });
  sprawdz('link otwarty w innym oknie: nie ruszany', uklad() === '1 2g5 10g5 3g5 4', uklad());

  reset();
  A.ustawienia = { ogolne: { kartyNaKoniec: false } };
  await otworz(10, 2);
  sprawdz('wyłączone w ustawieniach: Chrome decyduje', uklad() === '1 2g5 10g5 3g5 4', uklad());

  reset();
  A.ustawienia = { ogolne: { kopiujLink: false } };
  await otworz(10, 1);
  sprawdz('brak pola kartyNaKoniec w storage = włączone', uklad() === '1 2g5 3g5 4 10', uklad());

  reset();
  A.wolnyMove = true;
  await Promise.all([otworz(10, 2), otworz(11, 2), otworz(12, 2)]);
  sprawdz('trzy szybkie linki: na końcu w kolejności otwierania', uklad() === '1 2g5 3g5 4 10 11 12', uklad());

  reset();
  A.zamknietaPrzedMove = true;
  const ostrzez = console.warn; let ostrzezenia = 0; console.warn = () => ostrzezenia++;
  await otworz(10, 1);
  await otworz(11, 1).catch(() => {});
  console.warn = ostrzez;
  A.zamknietaPrzedMove = false;
  await otworz(12, 1);
  sprawdz('karta zamknięta przed przeniesieniem: bez wyjątku, kolejka działa dalej', ostrzezenia === 2 && A.karty.at(-1).id === 12, `ostrzeżenia=${ostrzezenia}, ${uklad()}`);

  reset();
  await A.komenda('duplikuj-karte', await chrome.tabs.get(2));
  sprawdz('⌘D na karcie w grupie: duplikat na końcu, poza grupą', uklad() === '1 2g5 3g5 4 104', uklad());
  sprawdz('⌘D: oryginał zostaje aktywny, duplikat w tle', A.aktywna === 2, `aktywna=${A.aktywna}`);

  reset();
  A.karty = [{ id: 1, groupId: -1 }, { id: 2, groupId: 5 }, { id: 3, groupId: 5 }];
  A.grupaPrzyKoncu = true;
  await A.komenda('duplikuj-karte', await chrome.tabs.get(1));
  sprawdz('⌘D, grupa na końcu okna: duplikat za nią, nie w niej', uklad() === '1 2g5 3g5 103', uklad());

  reset();
  await A.komenda('duplikuj-karte', undefined);
  sprawdz('⌘D bez karty w zdarzeniu: aktywna z tabs.query', uklad() === '1 2g5 3g5 4 104' && A.aktywna === 2, uklad());

  reset();
  A.ustawienia = { ogolne: { duplikujKarte: false } };
  await A.komenda('duplikuj-karte', await chrome.tabs.get(2));
  sprawdz('⌘D wyłączone w ustawieniach: nic', uklad() === '1 2g5 3g5 4', uklad());

  reset();
  await A.komenda('kopiuj-link', await chrome.tabs.get(2));
  sprawdz('inna komenda: nic', uklad() === '1 2g5 3g5 4', uklad());

  reset();
  A.duplikatDziala = false;
  const ostrzez2 = console.warn; console.warn = () => {};
  await A.komenda('duplikuj-karte', await chrome.tabs.get(2));
  console.warn = ostrzez2;
  sprawdz('nieudane duplikowanie: bez wyjątku', uklad() === '1 2g5 3g5 4', uklad());

  reset();
  log.textContent += `\nWYNIK: ${ok}/${n}${ok === n ? ' — wszystko OK' : ' — SĄ BŁĘDY'}\n`;
}
if (AUTO) testuj();
</script>
