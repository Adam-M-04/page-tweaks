<meta charset="utf-8">
<title>Page Tweaks — ustawienia</title>
<style>
  :root { color-scheme: dark; }
  body {
    margin: 0; padding: 28px 16px; background: #0b1220; color: #e5e7eb;
    font: 13.5px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
  }
  main { max-width: 520px; margin: 0 auto; }
  header { display: flex; align-items: baseline; justify-content: space-between; margin: 0 0 16px; }
  h1 { font-size: 17px; margin: 0; }
  #zapisano { color: #4ade80; font-size: 12px; }
  section { background: #111a2d; border: 1px solid #1e293b; border-radius: 12px; margin: 0 0 12px; }
  h2 { font-size: 13px; margin: 0; padding: 10px 16px; border-bottom: 1px solid #1e293b; color: #cbd5e1; }
  h2 small { font-weight: 400; color: #64748b; margin-left: 6px; }
  label {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    padding: 10px 16px; color: #cbd5e1; cursor: pointer;
  }
  label + label { border-top: 1px solid #1a2438; }
  label:hover { color: #fff; }
  /* Checkbox jako przełącznik */
  input {
    appearance: none; flex: none; position: relative; margin: 0; cursor: pointer;
    width: 32px; height: 18px; border-radius: 9px; background: #334155; transition: background .15s;
  }
  input::before {
    content: ""; position: absolute; top: 2px; left: 2px; width: 14px; height: 14px;
    border-radius: 50%; background: #e5e7eb; transition: transform .15s;
  }
  input:checked { background: #2563eb; }
  input:checked::before { transform: translateX(14px); }
  input:focus-visible { outline: 2px solid #60a5fa; outline-offset: 2px; }
</style>

<main>
  <header>
    <h1>Page Tweaks</h1>
    <span id="zapisano"></span>
  </header>

  <section>
    <h2>medium.com <small>i publikacje na własnych domenach</small></h2>
    <label>Ciemny motyw <input type="checkbox" role="switch" data-klucz="medium" data-pole="ciemnyMotyw"></label>
  </section>

  <section>
    <h2>qnews.pl</h2>
    <label>Ciemny motyw <input type="checkbox" role="switch" data-klucz="qnews" data-pole="ciemnyMotyw"></label>
  </section>

  <section>
    <h2>limanowa.in</h2>
    <label>Czytnik bez reklam <input type="checkbox" role="switch" data-klucz="limanowa" data-pole="czytnik"></label>
    <label>Wpisy od najnowszego, z datami <input type="checkbox" role="switch" data-klucz="limanowa" data-pole="daty"></label>
  </section>

  <section>
    <h2>rmf24.pl</h2>
    <label>Bez reklam <input type="checkbox" role="switch" data-klucz="rmf24" data-pole="bezReklam"></label>
    <label>Wpisy z X, Instagrama i Facebooka za przyciskiem <input type="checkbox" role="switch" data-klucz="rmf24" data-pole="wpisy"></label>
    <label>Bez paneli „Najnowsze” i „Najpopularniejsze” <input type="checkbox" role="switch" data-klucz="rmf24" data-pole="panele"></label>
    <label>Godzina dodania na kafelkach <input type="checkbox" role="switch" data-klucz="rmf24" data-pole="daty"></label>
    <label>Przeczytane wpisy przygaszone <input type="checkbox" role="switch" data-klucz="rmf24" data-pole="przeczytane"></label>
  </section>
</main>

<script src="ustawienia.js"></script>
<script src="options.js"></script>
